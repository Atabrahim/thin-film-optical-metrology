name: Scientific Python CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tools and build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,app]"
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Verify installed package and scientific behavior
        run: |
          python -c "import thinfilm; print(thinfilm.__file__)"
          python -m pytest -q
          ruff check src tests examples
          ruff format --check src tests examples
      - name: Reproduce complete CLI workflow
        run: thinfilm examples/case_study.json --output outputs/ci
