[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thin-film-optical-metrology"
version = "0.1.0"
description = "Coherent thin-film optics, thickness inference and tolerance studies"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[project.scripts]
thinfilm = "thinfilm.cli:main"

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
app = ["streamlit>=1.40", "plotly>=5.20"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2", "tmm==0.2.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
